id: newsletter
display_name: "Newsletter Signup"
enabled: true

allowed_origins:
  - "https://example.com"
  - "https://www.example.com"

auth:
  site_key: "REPLACE_ME_WITH_OUTPUT_OF_formelay_keygen"
  transport: header
  header_name: "X-Formelay-Site-Key"

honeypot:
  field_name: "company"

fields:
  required: ["email"]
  validators:
    email: "email"
  max_field_length: 320   # RFC 5321 max mailbox length

rate_limit:
  per_ip: {rate: 2, window: 1m, burst: 2}
  per_form: {rate: 100, window: 1m, burst: 20}

response_mode: async

channels_required: any

channels:
  - id: discord-signups
    type: discord
    enabled: true
    config:
      webhook_url_env: "FORM_NEWSLETTER_DISCORD_WEBHOOK"
      template: "newsletter-discord.tmpl"
